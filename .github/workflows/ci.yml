name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci-test
          # The cluster lives in RAM. Every test truncates the tables, and on a
          # runner's disk each of those waits on an fsync. Test data is
          # disposable by definition, so durability buys nothing but wall clock.
          PGDATA: /dev/shm/pgdata
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # DATABASE_URL is all CI has to supply: it is the one value that varies by
      # environment, which is why it is also the only key .env.test carries. The
      # rest of the suite's environment is pinned by
      # src/server/test-utils/test-env.ts, preloaded into every test file.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci-test
      # The per-file cap in run-tests.ts is a hang detector, not a speed limit.
      # A runner is slower than a laptop even with the database in RAM, and
      # killing a file that needed another few seconds loses every test in it.
      TEST_FILE_TIMEOUT_MS: "180000"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
